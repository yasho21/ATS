<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATS Resume Matcher</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    <header class="header">
      <h1>ATS Resume Matcher</h1>
      <p>Upload your resume and paste a job description to see how well they match.</p>
    </header>

    <main class="layout">
      <section class="card">
        <form id="matcher-form">
          <div class="field">
            <label for="resume">Resume <span class="hint">(PDF or DOCX, max 5MB)</span></label>
            <div class="dropzone" id="dropzone">
              <input type="file" id="resume" name="resume" accept=".pdf,.docx" hidden>
              <div id="dropzone-content">
                <span class="dropzone-icon">📄</span>
                <span id="dropzone-text">Drag &amp; drop your resume, or click to browse</span>
              </div>
            </div>
          </div>

          <div class="field">
            <label for="job_description">Job Description</label>
            <textarea id="job_description" name="job_description" rows="10"
              placeholder="Paste the full job description here..."></textarea>
          </div>

          <button type="submit" id="submit-btn">Analyze Match</button>
          <p class="error" id="error-msg" hidden></p>
        </form>
      </section>

      <section class="card result" id="result" hidden>
        <div class="score-block">
          <div class="score-ring" id="score-ring">
            <span id="score-value">0</span>
          </div>
          <div class="score-meta">
            <h2 id="verdict"></h2>
            <div class="sub-scores">
              <div>
                <span class="sub-label">Content Similarity</span>
                <div class="bar"><div class="bar-fill" id="similarity-bar"></div></div>
                <span class="sub-value" id="similarity-value"></span>
              </div>
              <div>
                <span class="sub-label">Keyword Coverage</span>
                <div class="bar"><div class="bar-fill" id="keyword-bar"></div></div>
                <span class="sub-value" id="keyword-value"></span>
              </div>
            </div>
          </div>
        </div>

        <div class="keywords">
          <div class="keyword-group">
            <h3>✅ Matched Keywords <span id="matched-count"></span></h3>
            <div class="chips" id="matched-chips"></div>
          </div>
          <div class="keyword-group">
            <h3>⚠️ Missing Keywords <span id="missing-count"></span></h3>
            <div class="chips" id="missing-chips"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
